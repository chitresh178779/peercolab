<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1f2937" stroke-width="2" stroke-opacity="0.6"/>
    </pattern>
    <!-- Color Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Neobrutalist Shadow for App Container -->
  <rect x="38" y="38" width="448" height="448" rx="96" fill="#000000" />

  <!-- Main App Container -->
  <rect x="26" y="26" width="448" height="448" rx="96" fill="#0b0f19" stroke="#000000" stroke-width="12" />

  <!-- Grid Overlay for Sketchbook Texture -->
  <rect x="32" y="32" width="436" height="436" rx="90" fill="url(#grid)" />

  <!-- Connecting Node Cable between Cards (creates collaboration visual) -->
  <path d="M 220 250 Q 260 275 285 245" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round" />
  <path d="M 220 250 Q 260 275 285 245" fill="none" stroke="#84cc16" stroke-width="8" stroke-linecap="round" />

  <!-- Card 1: Peer Card (Purple) -->
  <g transform="translate(90, 140) rotate(-8)">
    <!-- Shadow -->
    <rect x="14" y="14" width="180" height="180" rx="32" fill="#000000" />
    <!-- Card Body -->
    <rect x="0" y="0" width="180" height="180" rx="32" fill="url(#purpleGrad)" stroke="#000000" stroke-width="8" />
    <!-- Peer Avatar Icons inside -->
    <g transform="translate(90, 90)">
      <!-- Avatar 1 (Left/Back) -->
      <path d="M -55 42 C -55 18, 5 18, 5 42 Z" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
      <circle cx="-25" cy="-8" r="22" fill="#ffffff" stroke="#000000" stroke-width="6" />
      <!-- Avatar 2 (Right/Front) -->
      <path d="M -5 52 C -5 28, 55 28, 55 52 Z" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
      <circle cx="25" cy="2" r="22" fill="#ffffff" stroke="#000000" stroke-width="6" />
    </g>
  </g>

  <!-- Card 2: Colab / Code Card (Blue) -->
  <g transform="translate(240, 210) rotate(8)">
    <!-- Shadow -->
    <rect x="14" y="14" width="180" height="180" rx="32" fill="#000000" />
    <!-- Card Body -->
    <rect x="0" y="0" width="180" height="180" rx="32" fill="url(#blueGrad)" stroke="#000000" stroke-width="8" />
    <!-- Code Brackets Icons inside -->
    <g transform="translate(90, 90)">
      <!-- Bracket Left -->
      <path d="M -40 -25 L -65 0 L -40 25" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Bracket Right -->
      <path d="M 40 -25 L 65 0 L 40 25" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Code Slash -->
      <line x1="15" y1="-32" x2="-15" y2="32" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    </g>
  </g>

  <!-- Big Smart Sparkle (Top Right) -->
  <g transform="translate(345, 125)">
    <!-- Shadow -->
    <path d="M 12 -48 Q 12 12 -48 12 Q 12 12 12 72 Q 12 12 72 12 Q 12 12 12 -48 Z" fill="#000000" />
    <!-- Sparkle Body -->
    <path d="M 0 -60 Q 0 0 -60 0 Q 0 0 0 60 Q 0 0 60 0 Q 0 0 0 -60 Z" fill="url(#yellowGrad)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Small Smart Sparkle (Bottom Left) -->
  <g transform="translate(100, 395) scale(0.5)">
    <!-- Shadow -->
    <path d="M 12 -48 Q 12 12 -48 12 Q 12 12 12 72 Q 12 12 72 12 Q 12 12 12 -48 Z" fill="#000000" />
    <!-- Sparkle Body -->
    <path d="M 0 -60 Q 0 0 -60 0 Q 0 0 0 60 Q 0 0 60 0 Q 0 0 0 -60 Z" fill="url(#yellowGrad)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Floating Neobrutalist Decor Elements -->
  <!-- Tiny red square -->
  <rect x="175" y="75" width="16" height="16" fill="#f43f5e" stroke="#000000" stroke-width="3" transform="rotate(15 183 83)" />
  <!-- Small white circles -->
  <circle cx="410" cy="380" r="10" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <circle cx="215" cy="425" r="6" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <!-- Small crosses -->
  <path d="M 395 240 L 407 240 M 401 234 L 401 246" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M 75 100 L 87 100 M 81 94 L 81 106" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
</svg>